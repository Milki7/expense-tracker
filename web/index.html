<!DOCTYPE html>
<html>
<head>
    <title>Expense Tracker Frontend</title>
    <style>
        body { font-family: sans-serif; margin: 40px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #f4f4f4; }
        .summary { font-size: 1.2em; font-weight: bold; color: #2c3e50; }
    </style>
</head>
<body>
    <h1>My Expenses</h1>
    <div id="summary" class="summary">Loading total...</div>

    <table id="expense-table">
        <thead>
            <tr>
                <th>Date</th>
                <th>Title</th>
                <th>Category</th>
                <th>Amount</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        // Fetch Total Summary
        fetch('http://localhost:8080/api/v1/expenses/summary')
            .then(res => res.json())
            .then(data => {
                document.getElementById('summary').innerText = `Total Spending: $${data.total_spending}`;
            });

        // Fetch Expense List
        fetch('http://localhost:8080/api/v1/expenses?sort=created_at&order=desc')
            .then(res => res.json())
            .then(expenses => {
                const tbody = document.querySelector('#expense-table tbody');
                expenses.forEach(exp => {
                    const row = `<tr>
                        <td>${new Date(exp.CreatedAt).toLocaleDateString()}</td>
                        <td>${exp.title}</td>
                        <td>${exp.category}</td>
                        <td>$${exp.amount.toFixed(2)}</td>
                    </tr>`;
                    tbody.innerHTML += row;
                });
            });
    </script>
</body>
</html>
