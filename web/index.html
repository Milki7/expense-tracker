<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker Pro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css">
    <style>
        .actions { display: flex; gap: 5px; }
        .edit-btn { background-color: #f39c12; }
        .delete-btn { background-color: #e74c3c; }
        .summary-box { background: #f4f4f4; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
    </style>
</head>
<body>

    <h1>Expense Tracker</h1>

    <div class="summary-box">
        <span id="total-spending">Total Spending: $0.00</span>
    </div>

    <section>
        <h3 id="form-title">Add New Expense</h3>
        <form id="expense-form">
            <input type="hidden" id="expense-id">
            <input type="text" id="title" placeholder="Title (e.g. Lunch)" required>
            <input type="number" id="amount" placeholder="Amount" step="0.01" required>
            <input type="text" id="category" placeholder="Category (e.g. Food)" required>
            <button type="submit" id="submit-btn">Save Expense</button>
            <button type="button" id="cancel-btn" style="display:none;">Cancel</button>
        </form>
    </section>

    <hr>

    <section>
        <h3>All Expenses</h3>
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Title</th>
                    <th>Category</th>
                    <th>Amount</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="expense-list">
                </tbody>
        </table>
    </section>

    <script src="app.js"></script>
</body>
</html>
