<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExpenseTracker | Dashboard</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css">
    
    <style>
        :root {
            --brand-primary: #007bff;
            --brand-success: #28a745;
            --brand-danger: #e74c3c;
        }

        body {
            max-width: 1100px;
            background-color: #101010;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 10px;
            border-bottom: 2px solid #eee;
        }

        
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1.2fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e1e4e8;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .stats-label {
            color: #666;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .stats-value {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--brand-primary);
        }

        
        .filter-bar {
            display: flex;
            gap: 15px;
            align-items: flex-end;
            background: #f1f3f5;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .filter-group {
            flex: 1;
            margin: 0;
        }

        .filter-group label {
            font-size: 0.75rem;
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }

        .filter-group input, .filter-group select {
            margin-bottom: 0;
            width: 100%;
        }

        
        table {
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            background: rgb(185, 185, 185);
        }
        th{
            color: #101010;
        }
        .badge {
            background: #e9ecef;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: bold;
            color: #495057;
            text-transform: uppercase;
        }

        .btn-export { background-color: var(--brand-success); }
        .btn-cancel { background-color: #983308; }
        .btn-small { padding: 4px 10px; font-size: 0.8rem; }

        .chart-container {
            position: relative;
            height: 200px;
            width: 100%;
        }

        @media (max-width: 900px) {
            .dashboard-grid { grid-template-columns: 1fr; }
            .filter-bar { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>

    <header>
        <div>
            <h1 style="margin:0;">ExpenseTracker</h1>
            <p style="margin:0; color: #888;">Manage your personal finances</p>
        </div>
        <button class="btn-export" id="export-btn">📥 Export CSV</button>
    </header>

    <div class="dashboard-grid">
        
        <div class="card">
            <span class="stats-label">Total Spending</span>
            <span class="stats-value" id="total-spending">$0.00</span>
            <p style="font-size: 0.8rem; margin-top: 10px; color: #999;">Updated just now</p>
        </div>

        <div class="card">
            <span class="stats-label">Distribution</span>
            <div class="chart-container">
                <canvas id="categoryChart"></canvas>
            </div>
        </div>

        <div class="card">
            <h4 id="form-title" style="margin-top:0;">Add New Expense</h4>
            <form id="expense-form" style="margin:0;">
                <input type="hidden" id="expense-id">
                
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="title" placeholder="Description" required style="flex: 2;">
                    <input type="number" id="amount" placeholder="Amount" step="0.01" required style="flex: 1;">
                </div>

                <div style="display: flex; gap: 10px; margin-top: 10px;">
                    <input type="text" id="category" placeholder="Category" required style="flex: 1.5;">
                    <button type="submit" id="submit-btn" style="flex: 1;">Save</button>
                    <button type="button" id="cancel-btn" class="btn-cancel" style="display:none; flex: 0.5;">X</button>
                </div>
            </form>
        </div>

    </div>

    <div class="filter-bar">
        <div class="filter-group">
            <label>Search Title</label>
            <input type="text" id="search-title" placeholder="e.g. Starbucks">
        </div>
        <div class="filter-group">
            <label>Sort By</label>
            <select id="sort-by">
                <option value="created_at">Date (Newest)</option>
                <option value="amount">Amount (Highest)</option>
                <option value="title">Name (A-Z)</option>
            </select>
        </div>
        <button id="search-btn" style="height: fit-content;">Apply Filters</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Date</th>
                <th>Description</th>
                <th>Category</th>
                <th>Amount</th>
                <th style="text-align: right;">Actions</th>
            </tr>
        </thead>
        <tbody id="expense-list">
            </tbody>
    </table>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="app.js"></script>
</body>
</html>
